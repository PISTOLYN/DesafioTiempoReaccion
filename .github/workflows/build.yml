name: Build x86 y x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [ win-x86, win-x64 ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish ${{ matrix.runtime }}
        run: dotnet publish src/DesafioTiempoReaccion.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -o publish/${{ matrix.runtime }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesafioTiempoReaccion-${{ matrix.runtime }}
          path: publish/${{ matrix.runtime }}
